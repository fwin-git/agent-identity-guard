name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: macos-latest  # no Python 3.9 build for Apple silicon runners
            python: "3.9"
        include:
          - os: macos-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: setup.cmd finds Python and stops cleanly without answers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "USERPROFILE=%RUNNER_TEMP%\home"
          mkdir "%USERPROFILE%\.claude"
          call setup.cmd < NUL
          if not errorlevel 1 exit /b 1
          if exist "%USERPROFILE%\.identity-guard" exit /b 1
          echo setup.cmd ran and changed nothing
